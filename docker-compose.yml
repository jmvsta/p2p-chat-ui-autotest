version: '3.9'

services:
  server-manager:
    build: .
#    image: ktor-app
    container_name: server-manager
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    networks:
      - monitoring
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge